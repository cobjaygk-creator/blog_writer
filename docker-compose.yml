services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: blog
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-strong}
      POSTGRES_DB: blog_writer
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blog -d blog_writer"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql://blog:${POSTGRES_PASSWORD:-change-me-strong}@db:5432/blog_writer?schema=public
    volumes:
      - uploads:/app/public/uploads
      - appdata:/app/.data
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
  appdata:
